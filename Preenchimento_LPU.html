<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preenchimento LPU</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gd:#8CBF3F;--gm:#8CBF3F;--gl:#f4f9ec;
  --red:#c0392b;--g50:#f7f8fa;--g100:#eef0f3;
  --g300:#d0d5dd;--g500:#6b7585;--g800:#2d3444;
  --bdr:#d4ddd8;--r:6px;--rl:10px;
}
body{font-family:'Segoe UI',Arial,sans-serif;background:#ecf0eb;color:var(--g800);font-size:14px;line-height:1.5;padding:24px 16px 40px}
.shell{max-width:960px;margin:0 auto;background:#fff;border-radius:14px;box-shadow:0 4px 24px rgba(26,92,55,.13);overflow:hidden}
.fhd{background:var(--gd);padding:24px 32px;display:flex;align-items:center;gap:20px}
.lz{flex-shrink:0;width:220px;height:110px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;overflow:hidden;background:rgba(255,255,255,.07)}
.lz img{width:100%;height:100%;object-fit:contain}
.hi h1{font-size:20px;font-weight:700;color:#fff;margin-bottom:4px}
.hi p{font-size:12px;color:rgba(255,255,255,.6)}

/* Progress */

.fb{padding:28px 32px 40px}
.sec{margin-top:28px;font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--gd);padding-bottom:7px;border-bottom:2px solid var(--gd);margin:0 0 14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px 18px}
.s2{grid-column:span 2}.s3{grid-column:span 3}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:10px;font-weight:700;color:var(--g500);text-transform:uppercase;letter-spacing:.5px}
.req{color:var(--red)}
input[type="text"],input[type="number"],input[type="date"],input[type="file"],select,textarea{width:100%;padding:8px 11px;border:1px solid var(--bdr);border-radius:var(--r);font-size:13.5px;font-family:inherit;color:var(--g800);background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--gm);box-shadow:0 0 0 3px rgba(140,191,63,.15)}
textarea{resize:vertical;min-height:60px}

/* Table */
.data-table{width:100%;border-collapse:collapse;margin:16px 0;font-size:12px}
.data-table th{background:var(--gd);color:#fff;padding:8px 6px;font-size:10px;text-transform:uppercase;letter-spacing:.3px;text-align:center}
.data-table td{border-bottom:1px solid var(--bdr);padding:7px 6px;text-align:center;font-size:11px}
.data-table tr:nth-child(even) td{background:var(--g50)}
.row-subtotal{background:var(--gl)!important;font-weight:700;color:var(--gd)}
.row-subtotal td{background:var(--gl)!important;text-align:right}
.btn-remove{background:none;border:none;cursor:pointer;color:var(--g300);font-size:14px;transition:color .15s}
.btn-remove:hover{color:var(--red)}
#total-geral-box{font-size:1.3em;text-align:right;margin-top:16px;color:var(--gd);border-top:2px solid var(--gd);padding-top:10px;font-weight:700}

/* Add item row */
.add-row{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;margin-top:12px;align-items:end}
.add-btn{padding:9px 20px;border:none;border-radius:var(--r);cursor:pointer;font-weight:700;font-size:12px;font-family:inherit;background:var(--gd);color:#fff;transition:opacity .15s;white-space:nowrap}
.add-btn:hover{opacity:.85}

/* Photo preview */
.foto-preview-card{display:flex;align-items:center;gap:12px;border:1px solid var(--bdr);padding:10px;border-radius:var(--rl);background:var(--g50);margin-bottom:8px}
.foto-preview-card img{width:80px;height:60px;object-fit:cover;border-radius:var(--r);border:1px solid var(--bdr)}

/* Nav */
.nav-buttons{display:flex;gap:10px;justify-content:space-between;margin-top:28px;padding-top:18px;border-top:1px solid var(--bdr)}
.btn{padding:9px 20px;border:none;border-radius:var(--r);cursor:pointer;font-weight:700;font-size:13px;font-family:inherit;letter-spacing:.3px;transition:opacity .15s,transform .1s}
.btn:active{transform:scale(.97)}
.btn:hover{opacity:.85}
.btng{background:var(--g100);color:var(--g800)}
.btnp{background:var(--gm);color:#fff}
.btn-lg{padding:12px 28px;font-size:14px}

/* ══ MOBILE OPTIMIZATIONS ══ */
@media (max-width: 768px) {
  body{padding:8px 4px 30px}
  .shell{border-radius:10px}
  .fhd{padding:16px;gap:12px;flex-wrap:wrap;justify-content:center;text-align:center}
  .lz{width:140px;height:70px}
  .hi h1{font-size:17px}
  .hi p{font-size:11px}
  .fb{padding:16px 14px 30px}
  .sec{font-size:9px;margin-top:20px!important}
  .g2{grid-template-columns:1fr;gap:10px}
  .g3{grid-template-columns:1fr;gap:10px}
  .s2{grid-column:span 1}
  .s3{grid-column:span 1}
  .add-row{grid-template-columns:1fr 1fr;gap:8px}
  .add-row .add-btn{grid-column:span 2;padding:12px;font-size:13px}
  input[type="text"],input[type="number"],input[type="date"],input[type="file"],select,textarea{
    font-size:16px!important;padding:10px 12px;-webkit-appearance:none;
  }
  select{font-size:14px!important}
  .fld label{font-size:11px}
  .btn-lg{width:100%;text-align:center;padding:14px;font-size:15px}
  
  /* Table: horizontal scroll wrapper */
  .table-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;margin:12px 0;border:1px solid var(--bdr);border-radius:var(--rl)}
  .data-table{min-width:650px;margin:0;font-size:11px}
  .data-table th{padding:6px 4px;font-size:8px;white-space:nowrap}
  .data-table td{padding:6px 4px;font-size:10px}
  
  #total-geral-box{font-size:1.1em;padding-top:8px}
  .foto-preview-card{flex-direction:column;align-items:stretch;gap:8px}
  .foto-preview-card img{width:100%;height:auto;max-height:150px}
}

@media (max-width: 400px) {
  .fhd{padding:12px 10px}
  .lz{width:110px;height:55px}
  .hi h1{font-size:15px}
  .fb{padding:12px 10px 24px}
  .add-row{grid-template-columns:1fr}
  .add-row .add-btn{grid-column:span 1}
}

/* Item list with inline qty */
.item-list{display:flex;flex-direction:column;gap:2px;margin:8px 0}
.item-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--bdr);border-radius:var(--r);background:#fff;transition:background .15s}
.item-row:nth-child(odd){background:var(--g50)}
.item-row:hover{background:var(--gl)}
.item-cod{font-size:10px;font-weight:700;color:var(--gd);min-width:60px;flex-shrink:0}
.item-desc{font-size:12px;color:var(--g800);flex:1;line-height:1.3}
.item-val{font-size:10px;color:var(--g500);min-width:55px;text-align:right;flex-shrink:0}
.item-qty{width:60px;min-width:60px;max-width:60px;padding:5px 6px;border:1px solid var(--bdr);border-radius:var(--r);font-size:13px;text-align:center;font-family:inherit;color:var(--g800);flex-shrink:0}
.item-qty:focus{border-color:var(--gm);box-shadow:0 0 0 2px rgba(140,191,63,.2)}
.item-qty-filled{border-color:var(--gd);background:var(--gl);font-weight:700}
.launch-btn{width:100%;padding:14px;border:none;border-radius:var(--r);background:var(--gd);color:#fff;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:12px;transition:opacity .15s}
.launch-btn:hover{opacity:.85}
.launch-btn:active{transform:scale(.98)}
@media(max-width:768px){
  .item-row{flex-wrap:wrap;gap:4px;padding:10px 8px}
  .item-cod{min-width:50px;font-size:9px}
  .item-desc{font-size:11px;flex-basis:calc(100% - 130px)}
  .item-qty{font-size:14px!important;min-height:44px}
}

.item-fator{width:70px;min-width:70px;max-width:70px;padding:4px 2px;border:1px solid var(--bdr);border-radius:var(--r);font-size:10px;font-family:inherit;color:var(--g800);flex-shrink:0;background:#fff;-webkit-appearance:none;appearance:none;text-align:center}
.item-fator:focus{border-color:var(--gm)}
@media(max-width:768px){.item-fator{font-size:12px!important;min-height:44px}}

/* Info button (descritivo técnico) */
.info-btn{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;min-width:16px;border-radius:50%;border:1.5px solid var(--gd);background:var(--gl);color:var(--gd);font-size:10px;font-weight:700;font-family:inherit;cursor:pointer;line-height:1;padding:0;vertical-align:middle;margin-left:2px;transition:background .15s,color .15s}
.info-btn:hover,.info-btn:active{background:var(--gd);color:#fff}
@media(max-width:768px){.info-btn{width:20px;height:20px;min-width:20px;font-size:12px}}

/* Modal: descritivo técnico */
.tec-overlay{display:none;position:fixed;inset:0;background:rgba(45,52,68,.55);z-index:1000;align-items:center;justify-content:center;padding:20px}
.tec-overlay.open{display:flex}
.tec-modal{background:#fff;border-radius:var(--rl);max-width:440px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.25);overflow:hidden;animation:tecIn .15s ease-out}
@keyframes tecIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.tec-modal-hd{background:var(--gd);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.tec-modal-hd .tec-cod{color:#fff;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.tec-modal-close{background:rgba(255,255,255,.18);border:none;color:#fff;width:24px;height:24px;border-radius:50%;font-size:15px;line-height:1;cursor:pointer;flex-shrink:0}
.tec-modal-close:hover{background:rgba(255,255,255,.32)}
.tec-modal-bd{padding:18px}
.tec-modal-bd .tec-desc{font-size:13px;font-weight:700;color:var(--g800);margin-bottom:10px;line-height:1.4}
.tec-modal-bd .tec-label{font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--gd);margin-bottom:5px}
.tec-modal-bd .tec-text{font-size:13px;color:var(--g500);line-height:1.55}

/* Login gate */
#login-gate{max-width:400px;margin:60px auto;background:#fff;border-radius:14px;box-shadow:0 4px 24px rgba(26,92,55,.13);overflow:hidden}
#login-gate .fhd{background:var(--gd);padding:24px 32px;text-align:center}
#login-gate .lz{width:100%;height:90px;margin:0 auto}
#login-gate .hi h1{font-size:17px}
#login-gate .lg-body{padding:28px 32px 32px}
#login-gate .fld{margin-bottom:14px}
#login-gate .lg-btn{width:100%;padding:11px;border:none;border-radius:var(--r);background:var(--gd);color:#fff;font-weight:700;font-size:13.5px;font-family:inherit;cursor:pointer;margin-top:6px;transition:opacity .15s}
#login-gate .lg-btn:hover{opacity:.88}
#login-gate .lg-btn:disabled{opacity:.6;cursor:default}
#login-gate .lg-error{color:var(--red);font-size:12px;margin-top:10px;text-align:center;display:none}
#login-gate .lg-error.show{display:block}
.session-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--gl);border-bottom:1px solid var(--bdr);padding:8px 32px;font-size:12px;color:var(--g500)}
.session-bar b{color:var(--g800)}
.session-bar button{background:none;border:1px solid var(--bdr);border-radius:var(--r);padding:4px 10px;font-size:11px;font-family:inherit;color:var(--g500);cursor:pointer}
.session-bar button:hover{color:var(--red);border-color:var(--red)}
</style>
</head>

        <div class="fld"><label>Data de Início</label><input type="date" id="data_inicio"></div>
        <div class="fld"><label>Data de Término</label><input type="date" id="data_fim"></div>

            <option value="3.1.1.2.05.0006 - Serviços de Manutenção CLIENTE - REPARO EMERGENCIAL EM CLIENTES (MANUTENÇÃO)">3.1.1.2.05.0006 - Manutenção CLIENTE - REPARO EMERGENCIAL</option>

const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const SESSION_KEY = "lpu_prestador_session";

function limparCnpj(v) {
    return (v || "").replace(/\D/g, "");
}

function formatarCnpjExibicao(digits) {
    if (!digits || digits.length !== 14) return digits || "";
    return digits.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, "$1.$2.$3/$4-$5");
}

async function fazerLogin() {
    const btn = document.getElementById("lg-btn");
    const errBox = document.getElementById("lg-error");
    errBox.classList.remove("show");

    const cnpjRaw = document.getElementById("lg-cnpj").value;
    const senha = document.getElementById("lg-senha").value;
    const cnpjDigits = limparCnpj(cnpjRaw);

    if (cnpjDigits.length !== 14 || !senha) {
        errBox.textContent = "Preencha o CNPJ e a senha corretamente.";
        errBox.classList.add("show");
        return;
    }

    btn.disabled = true;
    btn.textContent = "Entrando...";

    try {
        const { data, error } = await supa.rpc("validar_login_prestador", {
            p_cnpj: cnpjDigits,
            p_senha: senha
        });

        if (error || !data || data.length === 0) {
            errBox.textContent = "CNPJ ou senha inválidos.";
            errBox.classList.add("show");
            btn.disabled = false;
            btn.textContent = "Entrar";
            return;
        }

        const prestador = data[0];
        sessionStorage.setItem(SESSION_KEY, JSON.stringify(prestador));
        aplicarSessao(prestador);
    } catch (e) {
        errBox.textContent = "Erro de conexão. Tente novamente.";
        errBox.classList.add("show");
        btn.disabled = false;
        btn.textContent = "Entrar";
    }
}

function aplicarSessao(prestador) {
    document.getElementById("empresa").value = prestador.razao_social;
    document.getElementById("empresa").readOnly = true;
    document.getElementById("cnpj").value = formatarCnpjExibicao(prestador.cnpj);
    document.getElementById("cnpj").readOnly = true;
    document.getElementById("session-empresa-label").textContent = prestador.razao_social;

    document.getElementById("login-gate").style.display = "none";
    document.getElementById("app-shell").style.display = "block";
}

function fazerLogout() {
    sessionStorage.removeItem(SESSION_KEY);
    document.getElementById("app-shell").style.display = "none";
    document.getElementById("login-gate").style.display = "block";
    document.getElementById("lg-cnpj").value = "";
    document.getElementById("lg-senha").value = "";
    document.getElementById("lg-error").classList.remove("show");
    const btn = document.getElementById("lg-btn");
    btn.disabled = false;
    btn.textContent = "Entrar";
}

document.getElementById("lg-senha").addEventListener("keydown", (e) => {
    if (e.key === "Enter") fazerLogin();
});
document.getElementById("lg-cnpj").addEventListener("keydown", (e) => {
    if (e.key === "Enter") document.getElementById("lg-senha").focus();
});

(function restaurarSessao() {
    const raw = sessionStorage.getItem(SESSION_KEY);
    if (raw) {
        try {
            aplicarSessao(JSON.parse(raw));
        } catch (e) {}
    }
})();

    let dados = [];

function atualizarListaServicos() {
    const descContabil = document.getElementById("desc_contabil").value;
    const container = document.getElementById("item-list");
    container.innerHTML = '';
    
    if (!descContabil || !regrasFiltroCodigos[descContabil]) return;

    const regra = regrasFiltroCodigos[descContabil];
    lpu.forEach((item, index) => {
        const numCodigo = parseInt(item.cod.replace(/\D/g, ''));
        const noIntervalo = regra.intervalos.some(range => numCodigo >= range.inicio && numCodigo <= range.fim);
        const ehEspecifico = regra.especificos.includes(item.cod);

        if (noIntervalo || ehEspecifico) {
            const row = document.createElement("div");
            row.className = "item-row";
            
            const valorUnit = item.valor;
            const valorStr = (valorUnit !== null) ? "R$ " + valorUnit.toFixed(2) : "—";
            
            const temTec = !!(item.tec && item.tec.trim());
            row.innerHTML = '<span class="item-cod">' + item.cod + '</span>' +
                '<span class="item-desc">' + item.desc +
                (temTec ? ' <button type="button" class="info-btn" data-idx="' + index + '" onclick="showTecInfo(' + index + ')" aria-label="Ver descritivo técnico">?</button>' : '') +
                '</span>' +
                '<select class="item-fator" data-idx="' + index + '" onchange="updateValDisplay(' + index + ', this)"><option value="comum">Comum</option><option value="critico">Crítico</option></select>' +
                '<span class="item-val" id="val-' + index + '">' + valorStr + '</span>' +
                '<input type="number" class="item-qty" data-idx="' + index + '" placeholder="0" min="0" step="1" oninput="highlightQty(this)">';
            
            container.appendChild(row);
        }
    });
}

function showTecInfo(index) {
    const item = lpu[index];
    if (!item) return;
    document.getElementById("tec-cod").textContent = item.cod;
    document.getElementById("tec-desc").textContent = item.desc;
    document.getElementById("tec-text").textContent = item.tec || "Descritivo técnico não cadastrado para este item.";
    document.getElementById("tec-overlay").classList.add("open");
}

function closeTecInfo() {
    document.getElementById("tec-overlay").classList.remove("open");
}

document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeTecInfo();
});

function updateValDisplay(index, selectEl) {
    const item = lpu[index];
    if (!item) return;
    const fator = selectEl.value;
    const valorUnit = (fator === "critico") ? item.valorCritico : item.valor;
    const valorStr = (valorUnit !== null && valorUnit !== undefined) ? "R$ " + valorUnit.toFixed(2) : "—";
    const valSpan = document.getElementById("val-" + index);
    if (valSpan) valSpan.textContent = valorStr;
}

function highlightQty(input) {
    if (parseFloat(input.value) > 0) {
        input.classList.add("item-qty-filled");
    } else {
        input.classList.remove("item-qty-filled");
    }
}



function launchItems() {
    const inputs = document.querySelectorAll(".item-qty");
    let added = 0;
    
    inputs.forEach(function(input) {
        const qty = parseFloat(input.value);
        if (!qty || qty <= 0) return;
        
        const idx = parseInt(input.dataset.idx);
        const item = lpu[idx];
        
        // Read fator from this row's select
        const fatorSelect = input.closest(".item-row").querySelector(".item-fator");
        const fator = fatorSelect ? fatorSelect.value : "comum";
        const fatorLabel = fator.charAt(0).toUpperCase() + fator.slice(1);
        
        var valorUnitario;
        
        if (item.cod === "SEV0086") {
            var valCustom = parseFloat(prompt("SEV0086 - Valor do reembolso por unidade (R$):"));
            if (isNaN(valCustom) || valCustom <= 0) return;
            valorUnitario = valCustom;
        } else {
            valorUnitario = (fator === "critico") ? item.valorCritico : item.valor;
        }
        
        dados.push({
            codigo: item.cod,
            descricao: item.desc,
            classe: item.classe,
            fator: fatorLabel,
            medida: item.medida,
            valor: valorUnitario,
            qtd: qty,
            total: valorUnitario * qty
        });
        
        input.value = '';
        input.classList.remove("item-qty-filled");
        added++;
    });
    
    if (added === 0) {
        alert("Preencha a quantidade em pelo menos um item.");
        return;
    }
    
    render();
}

    let listaFotos = []; 
    let fotoCounter = 0;

    function previewFotos() {
        const input = document.getElementById("fotos");
        if (!input.files) return;

        Array.from(input.files).forEach((file) => {
            const reader = new FileReader();
            reader.onload = function(e) {
                const id = fotoCounter++;
                listaFotos.push({
                    id: id,
                    src: e.target.result,
                    comentario: ''
                });
                renderFotos();
            }
            reader.readAsDataURL(file);
        });
        // Reset input para permitir subir as mesmas fotos novamente se necessário
        input.value = '';
    }

    function renderFotos() {
        const container = document.getElementById("container-previa-fotos");
        container.innerHTML = "";
        listaFotos.forEach(function(foto, index) {
            var div = document.createElement("div");
            div.className = "foto-preview-card";

            var img = document.createElement("img");
            img.src = foto.src;

            var mid = document.createElement("div");
            mid.style.cssText = "flex:1;display:flex;flex-direction:column;gap:4px";
            
            var lbl = document.createElement("label");
            lbl.style.cssText = "font-size:10px;font-weight:700;color:#6b7585;text-transform:uppercase;letter-spacing:.5px";
            lbl.textContent = "Foto " + (index + 1);

            var inp = document.createElement("input");
            inp.type = "text";
            inp.value = foto.comentario;
            inp.placeholder = "Legenda da foto...";
            (function(f) { inp.addEventListener("input", function() { f.comentario = this.value; }); })(foto);

            var fldDiv = document.createElement("div");
            fldDiv.className = "fld";
            fldDiv.appendChild(lbl);
            fldDiv.appendChild(inp);
            mid.appendChild(fldDiv);

            var btnRm = document.createElement("button");
            btnRm.textContent = "\u2715 Remover";
            btnRm.title = "Remover foto";
            btnRm.style.cssText = "background:#f5e8e8;color:#c0392b;border:1px solid #e0c0c0;cursor:pointer;font-size:11px;font-weight:700;padding:6px 12px;border-radius:6px;font-family:inherit;white-space:nowrap;align-self:flex-start";
            (function(fid) { btnRm.addEventListener("click", function() { removerFoto(fid); }); })(foto.id);

            div.appendChild(img);
            div.appendChild(mid);
            div.appendChild(btnRm);
            container.appendChild(div);
        });
    }

    function removerFoto(id) {
        listaFotos = listaFotos.filter(f => f.id !== id);
        renderFotos();
    }


    function render() {
        let tb = document.getElementById("tabela");
        tb.innerHTML = "";
        let totalGeral = 0;
        let classes = [...new Set(dados.map(d => d.classe))];

        classes.forEach(c => {
            let sub = 0;
            dados.filter(d => d.classe === c).forEach((d) => {
                sub += d.total; 
                totalGeral += d.total;
                tb.innerHTML += `<tr>
                    <td>${d.codigo}</td>
                    <td>${d.descricao}</td>
                    <td>${d.fator}</td>
                    <td>${d.classe}</td>
                    <td>${d.medida}</td>
                    <td>R$ ${d.valor.toFixed(2)}</td>
                    <td>${d.qtd}</td>
                    <td>R$ ${d.total.toFixed(2)}</td>
                    <td><button class="btn-remove" onclick="removerItem(${dados.indexOf(d)})">🗑️</button></td>
                </tr>`;
            });
            tb.innerHTML += `<tr class="row-subtotal"><td colspan="7">Subtotal ${c}</td><td colspan="2">R$ ${sub.toFixed(2)}</td></tr>`;
        });
        document.getElementById("total-geral-box").innerText = `Total Geral: R$ ${totalGeral.toFixed(2)}`;
    }

    function removerItem(index) {
        dados.splice(index, 1);
        render();
    }

    async function gerarPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('p', 'mm', 'a4');
        const larguraFolha = 210;
        const alturaFolha = 297;
        const m = 15;
        const larg = larguraFolha - m*2;
        let totalFinal = 0;

        const hoje = new Date();
        const dataRelatorio = hoje.toLocaleDateString('pt-BR');
        const formatarData = (data) => data ? data.split('-').reverse().join('/') : "--/--/----";

        const empresa = document.getElementById("empresa").value;
        const cnpj = document.getElementById("cnpj").value;
        const tecnicos = document.getElementById("tecnicos").value;
        const cliente = document.getElementById("cliente").value;
        const etiqueta = document.getElementById("etiqueta").value;
        const cidade = document.getElementById("cidade").value;
        const dInicio = formatarData(document.getElementById("data_inicio").value);
        const dFim = formatarData(document.getElementById("data_fim").value);
        const descContabil = document.getElementById("desc_contabil").value || "NÃO INFORMADO";

        // ── HEADER com logo ──
        try { doc.addImage(LOGO, 'JPEG', m, 10, 40, 18); } catch(e) {}
        doc.setFontSize(16);
        doc.setFont("helvetica", "bold");
        doc.setTextColor(61, 61, 61);
        doc.text("Relatório de Prestação de Serviços", 60, 20);

        // Linha verde separadora
        doc.setDrawColor(140, 191, 63);
        doc.setLineWidth(0.8);
        doc.line(m, 32, larguraFolha - m, 32);

        // ── TABELA DE IDENTIFICAÇÃO ──
        doc.autoTable({
            startY: 36,
            body: [
                [{content:'Empresa', styles:{fontStyle:'bold',fillColor:[244,249,236],textColor:[107,117,133],fontSize:7}}, {content:empresa, styles:{fontSize:9}}, {content:'CNPJ', styles:{fontStyle:'bold',fillColor:[244,249,236],textColor:[107,117,133],fontSize:7}}, {content:cnpj, styles:{fontSize:9}}],
                [{content:'Técnicos', styles:{fontStyle:'bold',fillColor:[244,249,236],textColor:[107,117,133],fontSize:7}}, {content:tecnicos, styles:{fontSize:9}}, {content:'Cidade', styles:{fontStyle:'bold',fillColor:[244,249,236],textColor:[107,117,133],fontSize:7}}, {content:cidade, styles:{fontSize:9}}],
                [{content:'Cliente / POP', styles:{fontStyle:'bold',fillColor:[244,249,236],textColor:[107,117,133],fontSize:7}}, {content:cliente, styles:{fontSize:9}}, {content:'ID / Etiqueta', styles:{fontStyle:'bold',fillColor:[244,249,236],textColor:[107,117,133],fontSize:7}}, {content:etiqueta, styles:{fontSize:9}}],
                [{content:'Período', styles:{fontStyle:'bold',fillColor:[244,249,236],textColor:[107,117,133],fontSize:7}}, {content:`${dInicio}  a  ${dFim}`, styles:{fontSize:9}}, {content:'Data Relatório', styles:{fontStyle:'bold',fillColor:[244,249,236],textColor:[107,117,133],fontSize:7}}, {content:dataRelatorio, styles:{fontSize:9}}],
                [{content:'Descrição Contábil', styles:{fontStyle:'bold',fillColor:[244,249,236],textColor:[107,117,133],fontSize:7}}, {content:descContabil, colSpan:3, styles:{fontSize:8,fontStyle:'bold',textColor:[140,191,63]}}],
            ],
            theme: 'grid',
            styles: { cellPadding:3, lineColor:[212,221,216], lineWidth:0.3 },
            columnStyles: { 0:{cellWidth:28}, 2:{cellWidth:28} },
            margin: { left: m, right: m }
        });

        let y = doc.lastAutoTable.finalY + 8;

        // ── TABELAS DE ITENS POR CLASSE ──
        const classes = [...new Set(dados.map(d => d.classe))];

        classes.forEach(c => {
            const itens = dados.filter(d => d.classe === c);
            const sub = itens.reduce((acc, curr) => acc + curr.total, 0);
            totalFinal += sub;

            doc.autoTable({
                startY: y,
                head: [['Cód.', 'Descrição', 'Fator', 'Classe', 'Med.', 'V. Unit', 'Qtd', 'Total']],
                body: itens.map(d => [d.codigo, d.descricao, d.fator, d.classe, d.medida, `R$ ${d.valor.toFixed(2)}`, d.qtd, `R$ ${d.total.toFixed(2)}`]),
                foot: [[{content:`Subtotal ${c}:`, colSpan:7, styles:{halign:'right',fontStyle:'bold',fillColor:[244,249,236],textColor:[140,191,63]}}, {content:`R$ ${sub.toFixed(2)}`, styles:{fontStyle:'bold',fillColor:[244,249,236],textColor:[140,191,63]}}]],
                theme: 'grid',
                headStyles: { fillColor: [140, 191, 63], textColor: [255,255,255], fontSize:7, fontStyle:'bold' },
                bodyStyles: { fontSize: 7 },
                footStyles: { fontSize: 8 },
                styles: { cellPadding:2.5, lineColor:[212,221,216], lineWidth:0.3 },
                alternateRowStyles: { fillColor: [250, 252, 247] },
                margin: { left: m, right: m }
            });
            y = doc.lastAutoTable.finalY + 6;
        });

        // ── TOTAL GERAL ──
        doc.setDrawColor(140, 191, 63);
        doc.setLineWidth(0.6);
        doc.line(larguraFolha - m - 70, y, larguraFolha - m, y);
        y += 6;
        doc.setFontSize(12);
        doc.setFont("helvetica", "bold");
        doc.setTextColor(140, 191, 63);
        doc.text(`TOTAL GERAL: R$ ${totalFinal.toFixed(2)}`, larguraFolha - m, y, { align: 'right' });

        // ── ASSINATURAS (após total geral) ──
        y += 20;
        if (y + 30 > alturaFolha - 20) { doc.addPage(); y = 30; }
        doc.setDrawColor(0);
        doc.setLineWidth(0.3);
        doc.line(m, y, 90, y);
        doc.setFontSize(8);
        doc.setTextColor(107, 117, 133);
        doc.setFont("helvetica", "normal");
        doc.text("Assinatura Prestador", 52.5, y + 5, { align: "center" });
        doc.line(120, y, larguraFolha - m, y);
        doc.text("Aprovador", 157.5, y + 5, { align: "center" });

        // ── RELATÓRIO FOTOGRÁFICO ──
        if (listaFotos.length > 0) {
            doc.addPage();
            // Header verde na página de fotos
            doc.setFillColor(140, 191, 63);
            doc.roundedRect(m, 8, larg, 10, 2, 2, 'F');
            doc.setFontSize(10);
            doc.setFont("helvetica", "bold");
            doc.setTextColor(255);
            doc.text("RELATÓRIO FOTOGRÁFICO", larguraFolha / 2, 15, { align: 'center' });

            let fotoNoSlide = 0;
            const fotoW = (larg - 10) / 2;
            const fotoH = 115;
            for (var i = 0; i < listaFotos.length; i++) {
                const restantes = listaFotos.length - i;
                const limitePagina = (restantes + fotoNoSlide <= 2) ? 2 : 4;
                if (fotoNoSlide === limitePagina) {
                    doc.addPage();
                    fotoNoSlide = 0;
                    doc.setFillColor(140, 191, 63);
                    doc.roundedRect(m, 8, larg, 10, 2, 2, 'F');
                    doc.setFontSize(10);
                    doc.setFont("helvetica", "bold");
                    doc.setTextColor(255);
                    doc.text("RELATÓRIO FOTOGRÁFICO", larguraFolha / 2, 15, { align: 'center' });
                }
                const coluna = fotoNoSlide % 2;
                const linha = Math.floor(fotoNoSlide / 2);
                const posX = m + (coluna * (fotoW + 10));
                const posY = 25 + (linha * (fotoH + 18));
                try { doc.addImage(listaFotos[i].src, 'JPEG', posX, posY, fotoW, fotoH); } catch(e) {}
                doc.setDrawColor(212, 221, 216);
                doc.setLineWidth(0.3);
                doc.rect(posX, posY, fotoW, fotoH);
                const comentario = listaFotos[i].comentario || `Registro ${i + 1}`;
                doc.setFontSize(8);
                doc.setTextColor(107, 117, 133);
                doc.setFont("helvetica", "italic");
                doc.text(comentario, posX + fotoW / 2, posY + fotoH + 5, { align: "center", maxWidth: fotoW });
                fotoNoSlide++;
            }
        }

        // ── FOOTER em todas as páginas ──
        const pages = doc.internal.getNumberOfPages();
        for (let i = 1; i <= pages; i++) {
            doc.setPage(i);
            doc.setFontSize(7);
            doc.setTextColor(170);
            doc.setFont("helvetica", "normal");
            doc.text("Relatório de Prestação de Serviços", m, alturaFolha - 8);
            doc.text(`Página ${i} de ${pages}`, larguraFolha - m, alturaFolha - 8, { align: 'right' });
            // Thin green line
            doc.setDrawColor(140, 191, 63);
            doc.setLineWidth(0.4);
            doc.line(m, alturaFolha - 12, larguraFolha - m, alturaFolha - 12);
        }

        const _empresa = (document.getElementById("empresa").value||"LPU").replace(/\s+/g,"_");
        const _etiqueta = (document.getElementById("etiqueta").value||"").replace(/\s+/g,"_");
        const _descRaw = document.getElementById("desc_contabil").value||"";
        const _descCode = _descRaw.split(" - ")[0].replace(/\s+/g,"").replace(/\./g,"-") || "";
        const _dataRel = new Date().toLocaleDateString("pt-BR").replace(/\//g,"-");
        const _totalStr = "R$" + totalFinal.toFixed(2).replace(".",",");
        const _parts = [_empresa, _etiqueta, _descCode, _dataRel, _totalStr].filter(Boolean);
        doc.save(`${_parts.join("_")}.pdf`);
    }


// Inicialização

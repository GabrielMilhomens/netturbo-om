<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Net Turbo</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--gd:#8CBF3F;--gl:#f4f9ec;--red:#c0392b;--bdr:#d4ddd8;--r:8px}
body{font-family:'Segoe UI',Arial,sans-serif;background:#ecf0eb;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#fff;border-radius:16px;box-shadow:0 8px 32px rgba(26,92,55,.13);width:100%;max-width:380px;overflow:hidden}
.card-hd{background:var(--gd);padding:32px 32px 28px;text-align:center}
.card-hd img{width:160px;height:70px;object-fit:contain;margin-bottom:14px;display:block;margin-left:auto;margin-right:auto}
.card-hd h1{font-size:18px;font-weight:700;color:#fff;margin-bottom:4px}
.card-hd p{font-size:12px;color:rgba(255,255,255,.7)}
.card-body{padding:28px 32px 32px}
.fld{margin-bottom:16px}
.fld label{display:block;font-size:11px;font-weight:700;color:#6b7585;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.fld input{width:100%;padding:11px 14px;border:1.5px solid var(--bdr);border-radius:var(--r);font-size:14px;font-family:inherit;color:#2d3444;outline:none;transition:border .15s}
.fld input:focus{border-color:var(--gd);box-shadow:0 0 0 3px rgba(140,191,63,.15)}
.fld input.err{border-color:var(--red)}
.btn-login{width:100%;padding:12px;background:var(--gd);color:#fff;border:none;border-radius:var(--r);font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:filter .15s;margin-top:4px}
.btn-login:hover{filter:brightness(1.07)}
.btn-login:disabled{opacity:.6;cursor:default}
.alert{padding:10px 14px;border-radius:6px;font-size:12px;margin-bottom:16px;display:none;text-align:center}
.alert.show{display:block}
.alert-err{background:#fde;border:1px solid #f5b8b8;color:#c0392b}
.spinner-sm{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.footer{text-align:center;margin-top:20px;font-size:11px;color:#9aa5b4}
</style>
</head>

    <h1>Preenchimento LPU</h1>
    <p>Net Turbo Telecom — O&M</p>
  </div>
  <div class="card-body">
    <div class="alert alert-err" id="alert"></div>
    <div class="fld">
      <label>Usuário</label>
      <input type="text" id="inp-user" placeholder="seu.usuario" autocomplete="username" autocapitalize="none">
    </div>
    <div class="fld">
      <label>Senha</label>
      <input type="password" id="inp-pass" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn-login" id="btn-login" onclick="doLogin()">Entrar</button>
    <div class="footer">Net Turbo Telecom © 2026</div>
  </div>
</div>

<script>
const SUPABASE_URL = localStorage.getItem('sb_url') || 'https://awbehzomxcsbasgltlih.supabase.co';
const SUPABASE_KEY = localStorage.getItem('sb_key') || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF3YmVoem9teGNzYmFzZ2x0bGloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5ODUyMjYsImV4cCI6MjA5NTU2MTIyNn0.9zuX49pdzjdehf8pyuRxYm1QPcqHgAWoKyVYXdohLDY';

// Se já está logado, vai direto para a LPU
if(sessionStorage.getItem('nt_usuario')){
  window.location.href = 'Preenchimento_LPU.html';
}

async function sha256(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function showAlert(msg){
  const el = document.getElementById('alert');
  el.textContent = msg;
  el.classList.add('show');
}

document.getElementById('inp-pass').addEventListener('keydown', e=>{
  if(e.key==='Enter') doLogin();
});

async function doLogin(){
  const usuario = document.getElementById('inp-user').value.trim().toLowerCase();
  const senha   = document.getElementById('inp-pass').value;
  const btn     = document.getElementById('btn-login');
  const alert   = document.getElementById('alert');
  alert.classList.remove('show');

  if(!usuario||!senha){showAlert('Preencha usuário e senha.');return;}

  btn.disabled=true;
  btn.innerHTML='<span class="spinner-sm"></span>Verificando...';

  try{
    const hash = await sha256(senha);
    const res  = await fetch(
      `${SUPABASE_URL}/rest/v1/usuarios?usuario=eq.${encodeURIComponent(usuario)}&select=*`,
      {headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`}}
    );
    if(!res.ok) throw new Error('Erro de conexão.');
    const data = await res.json();
    if(!data.length){showAlert('Usuário não encontrado.');return;}
    const user = data[0];
    if(!user.ativo){showAlert('Usuário inativo. Contate o gestor.');return;}
    if(user.senha_hash !== hash){showAlert('Senha incorreta.');return;}
    // Login OK
    sessionStorage.setItem('nt_usuario', user.usuario);
    sessionStorage.setItem('nt_nome',    user.nome);
    window.location.href = 'Preenchimento_LPU.html';
  }catch(e){
    showAlert(e.message||'Erro ao conectar. Tente novamente.');
  }finally{
    btn.disabled=false;
    btn.innerHTML='Entrar';
  }
}
</script>

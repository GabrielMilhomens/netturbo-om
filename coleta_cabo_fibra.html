<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Net Turbo - Coleta de Dados de Emenda</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --nt-green: #8CBF3F;
    --nt-green-dark: #6d9930;
    --nt-green-light: #eaf6de;
    --nt-dark: #2b2b2b;
    --nt-border: #d9dcd4;
    --nt-bg: #f4f6f2;
    --nt-red: #c0392b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--nt-bg);
    color: var(--nt-dark);
    padding-bottom: 100px;
    min-height: 100vh;
  }
  header {
    background: var(--nt-green);
    color: #fff;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 6px;
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 700; }
  header span { font-size: 12px; opacity: 0.9; }
  .container {
    max-width: 700px;
    margin: 20px auto;
    padding: 0 14px;
  }
  .caixa {
    background: #fff;
    border: 1px solid var(--nt-border);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 18px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  }
  .caixa-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 2px solid var(--nt-green);
  }
  .caixa-header h2 {
    font-size: 15px;
    color: var(--nt-green-dark);
    margin: 0;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--nt-green);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
  }
  .btn-remove-caixa {
    background: none;
    border: none;
    color: var(--nt-red);
    font-size: 12px;
    cursor: pointer;
    padding: 4px 8px;
    font-weight: 600;
  }
  .btn-remove-caixa:hover { text-decoration: underline; }
  .grid3 {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin-bottom: 14px;
  }
  .grid2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 14px;
  }
  .localizacao-row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    margin-bottom: 14px;
  }
  .localizacao-row .field { flex: 1; }
  .btn-gps {
    flex: 0 0 auto;
    height: 40px;
    padding: 0 14px;
    background: var(--nt-green-light);
    border: 1px solid var(--nt-green);
    color: var(--nt-green-dark);
    border-radius: 7px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-gps:hover { background: var(--nt-green); color: #fff; }
  .btn-gps:disabled { opacity: 0.6; cursor: not-allowed; }
  .field label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    color: #666;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    text-align: center;
  }
  .field input {
    width: 100%;
    padding: 10px 11px;
    border: 1px solid var(--nt-border);
    border-radius: 7px;
    font-size: 15px;
    background: #fbfcfa;
  }
  .field input:focus {
    outline: none;
    border-color: var(--nt-green);
    box-shadow: 0 0 0 3px rgba(140,191,63,0.2);
    background: #fff;
  }
  .cabo-row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    margin-bottom: 6px;
  }
  .cabo-row .field { flex: 1; }
  .pair-x {
    width: 32px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    color: var(--nt-green-dark);
    border: 1px solid var(--nt-border);
    border-radius: 7px;
    background: var(--nt-green-light);
    font-size: 13px;
  }
  .fibras-section {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px dashed var(--nt-border);
  }
  .fibras-title {
    font-size: 12px;
    font-weight: 700;
    color: #777;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    margin-bottom: 10px;
  }
  .fibra-row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    margin-bottom: 10px;
    background: #fafbf8;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ececec;
  }
  .fibra-row .field { flex: 1; }
  .fibra-num {
    width: 26px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: #999;
  }
  .btn-remove-fibra {
    width: 32px;
    height: 40px;
    border: 1px solid #e0b4ae;
    background: #fff;
    color: var(--nt-red);
    border-radius: 7px;
    font-size: 16px;
    cursor: pointer;
    flex: 0 0 auto;
  }
  .btn-remove-fibra:hover { background: #fdf1f0; }
  .btn-add-fibra {
    width: 100%;
    padding: 10px;
    background: #fff;
    border: 1.5px dashed var(--nt-green);
    color: var(--nt-green-dark);
    border-radius: 7px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-add-fibra:hover { background: var(--nt-green-light); }
  .btn-add-caixa {
    width: 100%;
    padding: 14px;
    background: #fff;
    border: 2px dashed var(--nt-green-dark);
    color: var(--nt-green-dark);
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 18px;
  }
  .btn-add-caixa:hover { background: var(--nt-green-light); }
  .footer-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #fff;
    border-top: 1px solid var(--nt-border);
    padding: 12px 14px;
    box-shadow: 0 -2px 8px rgba(0,0,0,0.06);
    z-index: 10;
  }
  .footer-inner {
    max-width: 700px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .btn-enviar {
    flex: 1;
    padding: 14px;
    background: var(--nt-green);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-enviar:hover { background: var(--nt-green-dark); }
  .btn-enviar:disabled { background: #b7d78f; cursor: not-allowed; }
  .resumo-count {
    font-size: 12px;
    color: #777;
    white-space: nowrap;
  }
  .status-msg {
    margin: 0 0 14px 0;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 14px;
    display: none;
  }
  .status-msg.success {
    display: block;
    background: var(--nt-green-light);
    color: var(--nt-green-dark);
    border: 1px solid var(--nt-green);
  }
  .status-msg.error {
    display: block;
    background: #fdecea;
    color: var(--nt-red);
    border: 1px solid #e0b4ae;
  }
  @media (max-width: 560px) {
    .grid3 { grid-template-columns: 1fr; }
    .grid2 { grid-template-columns: 1fr; }
    .localizacao-row { flex-direction: column; align-items: stretch; }
    .btn-gps { width: 100%; }
  }
</style>
</head>
<body>

<header>
  <h1>Coleta de Dados de Emenda - Net Turbo</h1>
  <span id="dataAtual"></span>
</header>

<div class="container">
  <div id="statusMsg" class="status-msg"></div>
  <div id="caixasContainer"></div>
  <button type="button" class="btn-add-caixa" onclick="adicionarCaixa()">+ Adicionar Caixa de Emenda</button>
</div>

<div class="footer-bar">
  <div class="footer-inner">
    <span class="resumo-count" id="resumoCount">0 caixa(s) · 0 fibra(s)</span>
    <button type="button" class="btn-enviar" id="btnEnviar" onclick="enviarTudo()">Enviar Todos os Registros</button>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://awbehzomxcsbasgltlih.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF3YmVoem9teGNzYmFzZ2x0bGloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5ODUyMjYsImV4cCI6MjA5NTU2MTIyNn0.9zuX49pdzjdehf8pyuRxYm1QPcqHgAWoKyVYXdohLDY';
  const TABLE_NAME = 'coleta_cabo_fibra';

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  document.getElementById('dataAtual').textContent = new Date().toLocaleDateString('pt-BR');

  let caixaSeq = 0;
  let fibraSeq = 0;

  function novaFibra() {
    fibraSeq++;
    return { id: 'f' + fibraSeq, fibraA: '', fibraB: '' };
  }

  function novaCaixa() {
    caixaSeq++;
    return {
      id: 'c' + caixaSeq,
      etiqueta: '',
      cidade: '',
      localizacao: '',
      caboA: '',
      caboB: '',
      fibras: [novaFibra()]
    };
  }

  let caixas = [novaCaixa()];

  function sincronizarModelo() {
    caixas.forEach(caixa => {
      const base = document.getElementById('caixa_' + caixa.id);
      if (!base) return;
      caixa.etiqueta = base.querySelector('[data-field="etiqueta"]').value;
      caixa.cidade = base.querySelector('[data-field="cidade"]').value;
      caixa.localizacao = base.querySelector('[data-field="localizacao"]').value;
      caixa.caboA = base.querySelector('[data-field="caboA"]').value;
      caixa.caboB = base.querySelector('[data-field="caboB"]').value;
      caixa.fibras.forEach(fibra => {
        const linha = document.getElementById('fibra_' + fibra.id);
        if (!linha) return;
        fibra.fibraA = linha.querySelector('[data-field="fibraA"]').value;
        fibra.fibraB = linha.querySelector('[data-field="fibraB"]').value;
      });
    });
  }

  function adicionarCaixa() {
    sincronizarModelo();
    caixas.push(novaCaixa());
    render();
  }

  function removerCaixa(caixaId) {
    sincronizarModelo();
    if (caixas.length <= 1) {
      alert('É necessário manter ao menos uma caixa de emenda.');
      return;
    }
    caixas = caixas.filter(c => c.id !== caixaId);
    render();
  }

  function adicionarFibra(caixaId) {
    sincronizarModelo();
    const caixa = caixas.find(c => c.id === caixaId);
    caixa.fibras.push(novaFibra());
    render();
  }

  function removerFibra(caixaId, fibraId) {
    sincronizarModelo();
    const caixa = caixas.find(c => c.id === caixaId);
    if (caixa.fibras.length <= 1) {
      alert('É necessário manter ao menos uma fibra por caixa.');
      return;
    }
    caixa.fibras = caixa.fibras.filter(f => f.id !== fibraId);
    render();
  }

  function contarFibrasTotal() {
    return caixas.reduce((acc, c) => acc + c.fibras.length, 0);
  }

  function render() {
    const container = document.getElementById('caixasContainer');
    container.innerHTML = '';

    caixas.forEach((caixa, idx) => {
      const div = document.createElement('div');
      div.className = 'caixa';
      div.id = 'caixa_' + caixa.id;

      const fibrasHtml = caixa.fibras.map((fibra, fidx) => `
        <div class="fibra-row" id="fibra_${fibra.id}">
          <div class="fibra-num">${fidx + 1}</div>
          <div class="field">
            <label>Fibra</label>
            <input type="text" data-field="fibraA" value="${escapeAttr(fibra.fibraA)}">
          </div>
          <div class="pair-x">X</div>
          <div class="field">
            <label>Fibra</label>
            <input type="text" data-field="fibraB" value="${escapeAttr(fibra.fibraB)}">
          </div>
          <button type="button" class="btn-remove-fibra" onclick="removerFibra('${caixa.id}','${fibra.id}')" title="Remover fibra">&times;</button>
        </div>
      `).join('');

      div.innerHTML = `
        <div class="caixa-header">
          <h2><span class="badge">${idx + 1}</span> Caixa de Emenda</h2>
          ${caixas.length > 1 ? `<button type="button" class="btn-remove-caixa" onclick="removerCaixa('${caixa.id}')">Remover caixa</button>` : ''}
        </div>

        <div class="grid2">
          <div class="field">
            <label>Etiqueta</label>
            <input type="text" data-field="etiqueta" value="${escapeAttr(caixa.etiqueta)}">
          </div>
          <div class="field">
            <label>Cidade</label>
            <input type="text" data-field="cidade" value="${escapeAttr(caixa.cidade)}">
          </div>
        </div>

        <div class="localizacao-row">
          <div class="field">
            <label>Localização</label>
            <input type="text" data-field="localizacao" value="${escapeAttr(caixa.localizacao)}">
          </div>
          <button type="button" class="btn-gps" onclick="capturarLocalizacao('${caixa.id}')">📍 Usar GPS</button>
        </div>

        <div class="cabo-row">
          <div class="field">
            <label>Cabo</label>
            <input type="text" data-field="caboA" value="${escapeAttr(caixa.caboA)}">
          </div>
          <div class="pair-x">X</div>
          <div class="field">
            <label>Cabo</label>
            <input type="text" data-field="caboB" value="${escapeAttr(caixa.caboB)}">
          </div>
        </div>

        <div class="fibras-section">
          <div class="fibras-title">Fibras desta caixa</div>
          ${fibrasHtml}
          <button type="button" class="btn-add-fibra" onclick="adicionarFibra('${caixa.id}')">+ Adicionar Fibra</button>
        </div>
      `;

      container.appendChild(div);
    });

    document.getElementById('resumoCount').textContent =
      caixas.length + ' caixa(s) · ' + contarFibrasTotal() + ' fibra(s)';
  }

  function capturarLocalizacao(caixaId) {
    if (!navigator.geolocation) {
      alert('Seu navegador não suporta captura de localização por GPS.');
      return;
    }

    const caixaDiv = document.getElementById('caixa_' + caixaId);
    const input = caixaDiv.querySelector('[data-field="localizacao"]');
    const btn = caixaDiv.querySelector('.btn-gps');

    btn.disabled = true;
    btn.textContent = 'Obtendo...';

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        input.value = `${lat}, ${lng}`;
        btn.disabled = false;
        btn.textContent = '📍 Usar GPS';
      },
      (err) => {
        btn.disabled = false;
        btn.textContent = '📍 Usar GPS';
        let msg = 'Não foi possível obter sua localização.';
        if (err.code === err.PERMISSION_DENIED) {
          msg = 'Permissão de localização negada. Ative o GPS/localização nas configurações do navegador.';
        } else if (err.code === err.TIMEOUT) {
          msg = 'Tempo esgotado ao tentar obter a localização. Tente novamente em um local com melhor sinal.';
        }
        alert(msg);
      },
      { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
    );
  }

  function escapeAttr(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/"/g, '&quot;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function mostrarStatus(tipo, texto) {
    const el = document.getElementById('statusMsg');
    el.className = 'status-msg ' + tipo;
    el.textContent = texto;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  async function enviarTudo() {
    sincronizarModelo();

    const registros = [];
    caixas.forEach(caixa => {
      caixa.fibras.forEach(fibra => {
        const registro = {
          etiqueta: (caixa.etiqueta || '').trim(),
          cidade: (caixa.cidade || '').trim(),
          localizacao: (caixa.localizacao || '').trim(),
          cabo_a: (caixa.caboA || '').trim(),
          cabo_b: (caixa.caboB || '').trim(),
          fibra_a: (fibra.fibraA || '').trim(),
          fibra_b: (fibra.fibraB || '').trim()
        };
        const algumPreenchido = Object.values(registro).some(v => v !== '');
        if (algumPreenchido) registros.push(registro);
      });
    });

    if (registros.length === 0) {
      mostrarStatus('error', 'Preencha ao menos um campo antes de enviar.');
      return;
    }

    const btn = document.getElementById('btnEnviar');
    btn.disabled = true;
    btn.textContent = 'Enviando...';

    const { error } = await supabaseClient.from(TABLE_NAME).insert(registros);

    btn.disabled = false;
    btn.textContent = 'Enviar Todos os Registros';

    if (error) {
      console.error(error);
      mostrarStatus('error', 'Erro ao enviar. Verifique sua conexão e tente novamente.');
      return;
    }

    mostrarStatus('success', registros.length + ' registro(s) enviado(s) com sucesso!');
    caixaSeq = 0;
    fibraSeq = 0;
    caixas = [novaCaixa()];
    render();
  }

  render();
</script>

</body>
</html>
